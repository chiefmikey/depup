name: "Automated Discovery & Sync"

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      discover_only:
        description: 'Only run discovery (skip sync)'
        required: false
        type: boolean
        default: false
      sync_only:
        description: 'Only run sync (skip discovery)'
        required: false
        type: boolean
        default: false

jobs:
  discover:
    name: Discover (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ !inputs.sync_only }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "DepUp Bot"
          git config --global user.email "bot@depup.dev"

      - name: Discover Packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: '5'
        run: |
          echo "Starting package discovery (shard ${{ matrix.shard }}/5)..."
          npm run cron:discover

      - name: Commit and Push Changes
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: discover packages via cron (shard ${{ matrix.shard }})"
          for attempt in 1 2 3 4 5; do
            # Try rebase first; if conflicts, fall back to merge
            if ! git pull --rebase origin main; then
              echo "Rebase failed (likely conflicts), falling back to merge..."
              git rebase --abort 2>/dev/null || true
              git pull origin main --no-edit -X ours || true
            fi
            if git push origin main; then
              echo "Push successful on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 attempts"
              exit 1
            fi
            echo "Push failed on attempt $attempt, retrying..."
            sleep $((attempt * 2))
          done

      - name: Shard Summary
        if: always()
        run: |
          echo "## Discovery Shard ${{ matrix.shard }} Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date)" >> $GITHUB_STEP_SUMMARY

  sync:
    name: Sync (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ !inputs.discover_only }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "DepUp Bot"
          git config --global user.email "bot@depup.dev"

      - name: Sync Packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: '5'
        run: |
          echo "Starting package sync (shard ${{ matrix.shard }}/5)..."
          npm run cron:sync

      - name: Self-Healing
        if: matrix.shard == 0
        run: |
          echo "Running self-healing checks..."
          npm run heal:auto

      - name: Commit and Push Changes
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: sync packages via cron (shard ${{ matrix.shard }})"
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then
              echo "Rebase failed (likely conflicts), falling back to merge..."
              git rebase --abort 2>/dev/null || true
              git pull origin main --no-edit -X ours || true
            fi
            if git push origin main; then
              echo "Push successful on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 attempts"
              exit 1
            fi
            echo "Push failed on attempt $attempt, retrying..."
            sleep $((attempt * 2))
          done

      - name: Shard Summary
        if: always()
        run: |
          echo "## Sync Shard ${{ matrix.shard }} Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date)" >> $GITHUB_STEP_SUMMARY
