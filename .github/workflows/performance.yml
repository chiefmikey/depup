name: Performance Monitoring

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to test (optional)'
        required: false
        type: string

# Read-only: measures performance and uploads artifacts, never pushes
permissions:
  contents: read

jobs:
  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test package processing performance
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          echo "Testing package processing performance..."

          # Test with a lightweight package
          TEST_PACKAGE="${INPUT_PACKAGE:-lodash}"

          echo "Testing with package: $TEST_PACKAGE"

          # Measure processing time
          start_time=$(date +%s)
          npm run depup -- "$TEST_PACKAGE" --debug --dry-run
          end_time=$(date +%s)

          processing_time=$((end_time - start_time))
          echo "Processing time: ${processing_time}s"

          # Save performance metrics (use jq for safe JSON construction)
          jq -n \
            --arg pkg "$TEST_PACKAGE" \
            --argjson time "$processing_time" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg node_ver "$(node --version)" \
            --arg npm_ver "$(npm --version)" \
            '{package: $pkg, processing_time_seconds: $time, timestamp: $ts, node_version: $node_ver, npm_version: $npm_ver}' \
            > performance-metrics.json

      - name: Test memory usage
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          echo "Testing memory usage..."

          # Monitor memory usage during package processing
          TEST_PACKAGE="${INPUT_PACKAGE:-lodash}"

          # Use Node.js built-in memory monitoring
          export TEST_PACKAGE
          node -e "
            const { execFileSync } = require('child_process');
            const startMemory = process.memoryUsage();
            const testPackage = process.env.TEST_PACKAGE;

            try {
              execFileSync('npm', ['run', 'depup', '--', testPackage, '--debug', '--dry-run'], { stdio: 'pipe' });
            } catch (error) {
              console.log('Command failed:', error.message);
            }

            const endMemory = process.memoryUsage();

            console.log('Memory usage:');
            console.log('Start RSS:', Math.round(startMemory.rss / 1024 / 1024), 'MB');
            console.log('End RSS:', Math.round(endMemory.rss / 1024 / 1024), 'MB');
            console.log('Peak RSS:', Math.round(endMemory.rss / 1024 / 1024), 'MB');

            // Save memory metrics
            const fs = require('fs');
            const memoryData = {
              package: testPackage,
              start_rss_mb: Math.round(startMemory.rss / 1024 / 1024),
              end_rss_mb: Math.round(endMemory.rss / 1024 / 1024),
              peak_rss_mb: Math.round(endMemory.rss / 1024 / 1024),
              timestamp: new Date().toISOString()
            };

            fs.writeFileSync('memory-metrics.json', JSON.stringify(memoryData, null, 2));
          "

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-metrics
          path: |
            performance-metrics.json
            memory-metrics.json
          retention-days: 7

      - name: Performance Summary
        if: always()
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          echo "## Performance Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Package**: ${INPUT_PACKAGE:-lodash}" >> $GITHUB_STEP_SUMMARY

          if [ -f performance-metrics.json ]; then
            PROCESSING_TIME=$(jq -r '.processing_time_seconds // "N/A"' performance-metrics.json 2>/dev/null || echo "N/A")
            echo "- **Processing Time**: ${PROCESSING_TIME}s" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f memory-metrics.json ]; then
            PEAK_RSS=$(jq -r '.peak_rss_mb // "N/A"' memory-metrics.json 2>/dev/null || echo "N/A")
            echo "- **Peak Memory Usage**: ${PEAK_RSS}MB" >> $GITHUB_STEP_SUMMARY
          fi

  benchmark-comparison:
    name: Benchmark Comparison
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run benchmark comparison
        run: |
          echo "Running benchmark comparison..."

          # Test multiple packages for comparison
          PACKAGES=("lodash" "express" "axios" "moment")

          for package in "${PACKAGES[@]}"; do
            echo "Benchmarking $package..."

            start_time=$(date +%s)
            npm run depup -- "$package" --debug --dry-run
            end_time=$(date +%s)

            processing_time=$((end_time - start_time))
            echo "$package: ${processing_time}s"
          done
