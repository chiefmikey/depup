name: Secure DepUp Package Processing

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'npm package to process securely (must be in allowlist)'
        required: true
        type: string
      bump_deps:
        description: 'Bump dependencies to latest versions'
        required: false
        type: boolean
        default: true
      test:
        description: 'Run comprehensive security testing'
        required: false
        type: boolean
        default: true
      publish:
        description: 'Publish to npm after security validation'
        required: false
        type: boolean
        default: false
      debug:
        description: 'Enable debug mode'
        required: false
        type: boolean
        default: false
      strict_security:
        description: 'Enforce strict security requirements'
        required: false
        type: boolean
        default: true

concurrency:
  group: depup-secure-${{ inputs.package }}
  cancel-in-progress: false

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  security-validation:
    name: Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      package_allowed: ${{ steps.allowlist-check.outputs.allowed }}
      security_status: ${{ steps.security-scan.outputs.status }}
      compatibility_score: ${{ steps.compatibility-test.outputs.score }}
      package_safe: ${{ steps.sanitize.outputs.safe_name }}

    steps:
      - name: Sanitize package name for artifact paths
        id: sanitize
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          SAFE_NAME=$(echo "$PACKAGE_NAME" | sed 's/[/@]/_/g')
          echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install security tools (optional)
        continue-on-error: true
        run: |
          # Try to install ClamAV for enhanced malware scanning
          if command -v apt-get >/dev/null 2>&1; then
            echo "Installing ClamAV..."
            sudo apt-get update && sudo apt-get install -y clamav clamav-daemon
            freshclam --quiet || echo "ClamAV database update failed, continuing..."
          else
            echo "apt-get not available, skipping ClamAV installation"
          fi

      - name: Validate package allowlist
        id: allowlist-check
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          STRICT_SECURITY: ${{ inputs.strict_security }}
        run: |
          echo "Checking if $PACKAGE_NAME is in security allowlist..."
          EXIT_CODE=0
          node scripts/security-approval.mjs status "$PACKAGE_NAME" || EXIT_CODE=$?

          # Check exit code to determine if package is allowed
          if [ $EXIT_CODE -eq 0 ]; then
            echo "allowed=true" >> $GITHUB_OUTPUT
            echo "✅ Package is in security allowlist"
          else
            echo "allowed=false" >> $GITHUB_OUTPUT
            echo "❌ Package not in security allowlist"
            if [ "$STRICT_SECURITY" = "true" ]; then
              echo "Strict security mode: failing workflow"
              exit 1
            fi
          fi

      - name: Download and extract package for scanning
        id: download
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          echo "Downloading package for security analysis..."
          mkdir -p temp-package
          cd temp-package
          npm init -y > /dev/null 2>&1
          npm install "$PACKAGE_NAME" --no-save

          # Strip version specifier for node_modules path lookup
          # e.g., express@5.0.0 -> express, @angular/core@17.0.0 -> @angular/core
          SCAN_NAME="$PACKAGE_NAME"
          if [[ "$SCAN_NAME" =~ ^(@[^@]+)@.+ ]]; then
            SCAN_NAME="${BASH_REMATCH[1]}"
          elif [[ "$SCAN_NAME" =~ ^([^@]+)@.+ ]]; then
            SCAN_NAME="${BASH_REMATCH[1]}"
          fi
          echo "scan_name=$SCAN_NAME" >> $GITHUB_OUTPUT

      - name: Run security scan
        id: security-scan
        env:
          SCAN_NAME: ${{ steps.download.outputs.scan_name }}
          STRICT_SECURITY: ${{ inputs.strict_security }}
        run: |
          echo "Running comprehensive security scan..."
          mkdir -p security-reports
          node scripts/security-scan.mjs "temp-package/node_modules/$SCAN_NAME" \
            --report security-reports/security-scan.json

          # Check scan results (find the latest report file)
          REPORT_FILE=$(ls -t security-reports/security-scan*.json | head -1)
          if [ -z "$REPORT_FILE" ]; then
            echo "❌ No security report found"
            exit 1
          fi
          SCAN_STATUS=$(jq -r '.overall_status // "unknown"' "$REPORT_FILE")
          echo "status=$SCAN_STATUS" >> $GITHUB_OUTPUT
          echo "Found security report: $REPORT_FILE"

          if [ "$SCAN_STATUS" = "failed" ]; then
            echo "❌ Security scan failed"
            if [ "$STRICT_SECURITY" = "true" ]; then
              exit 1
            fi
          else
            echo "✅ Security scan passed ($SCAN_STATUS)"
          fi

      - name: Run compatibility test
        id: compatibility-test
        env:
          SCAN_NAME: ${{ steps.download.outputs.scan_name }}
          STRICT_SECURITY: ${{ inputs.strict_security }}
        run: |
          echo "Running compatibility analysis..."
          COMPAT_ARGS=("temp-package/node_modules/$SCAN_NAME" "--report" "security-reports/compatibility.json")
          if [ "$STRICT_SECURITY" = "true" ]; then
            COMPAT_ARGS+=("--strict")
          fi
          node scripts/compatibility-test.mjs "${COMPAT_ARGS[@]}"

          # Extract compatibility score (find the latest report file)
          COMPATIBILITY_FILE=$(ls -t security-reports/compatibility*.json 2>/dev/null | head -1 || echo "security-reports/compatibility.json")
          if [ ! -f "$COMPATIBILITY_FILE" ]; then
            echo "Compatibility report not found, assuming score 80"
            COMPATIBILITY_SCORE=80
          else
            COMPATIBILITY_SCORE=$(jq -r '.compatibility.score // 80' "$COMPATIBILITY_FILE" 2>/dev/null || echo "80")
          fi
          echo "score=$COMPATIBILITY_SCORE" >> $GITHUB_OUTPUT

          if [ "$COMPATIBILITY_SCORE" -lt 60 ] && [ "$STRICT_SECURITY" = "true" ]; then
            echo "❌ Compatibility score too low: $COMPATIBILITY_SCORE/100"
            exit 1
          fi

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ steps.sanitize.outputs.safe_name || needs.security-validation.outputs.package_safe }}
          path: security-reports/
          retention-days: 30

      - name: Security validation summary
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          ALLOWLIST_STATUS: ${{ steps.allowlist-check.outputs.allowed }}
          SCAN_STATUS: ${{ steps.security-scan.outputs.status }}
          COMPAT_SCORE: ${{ steps.compatibility-test.outputs.score }}
          STRICT_SECURITY: ${{ inputs.strict_security }}
        run: |
          echo "## Security Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: $PACKAGE_NAME" >> $GITHUB_STEP_SUMMARY
          if [ "$ALLOWLIST_STATUS" = "true" ]; then
            echo "- **Allowlist Status**: APPROVED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Allowlist Status**: NOT APPROVED" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Security Scan**: $SCAN_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "- **Compatibility Score**: $COMPAT_SCORE/100" >> $GITHUB_STEP_SUMMARY
          if [ "$STRICT_SECURITY" = "true" ]; then
            echo "- **Strict Security**: Enabled" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Strict Security**: Disabled" >> $GITHUB_STEP_SUMMARY
          fi

  container-build:
    name: Build Security Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: security-validation
    if: needs.security-validation.outputs.package_allowed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build security sandbox
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: depup-security-sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/depup-sandbox.tar

      - name: Upload container image
        uses: actions/upload-artifact@v4
        with:
          name: depup-security-sandbox
          path: /tmp/depup-sandbox.tar
          retention-days: 1

  secure-processing:
    name: Secure Package Processing
    runs-on: ubuntu-latest
    needs: [security-validation, container-build]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download security container
        uses: actions/download-artifact@v4
        with:
          name: depup-security-sandbox
          path: /tmp/

      - name: Load security container
        run: |
          docker load --input /tmp/depup-sandbox.tar

      - name: Create secure processing environment
        run: |
          # Create temporary directories with proper permissions
          mkdir -p packages security-reports temp-processing
          chmod 755 packages security-reports temp-processing

      - name: Run secure package processing
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ inputs.package }}
          BUMP_DEPS: ${{ inputs.bump_deps }}
          DO_TEST: ${{ inputs.test }}
          DO_PUBLISH: ${{ inputs.publish }}
          DO_DEBUG: ${{ inputs.debug }}
        run: |
          echo "🚀 Starting secure package processing..."

          # Build docker run arguments
          # Note: network access is required for npm registry (download + dep version checks)
          # Security is enforced via: read-only rootfs, memory/cpu/pid limits, dropped caps
          DOCKER_ARGS=(
            "run" "--rm"
            "--read-only"
            "--tmpfs" "/tmp:rw,exec"
            "--memory" "2g"
            "--cpus" "2"
            "--pids-limit" "100"
            "--cap-drop" "ALL"
            "--security-opt" "no-new-privileges"
            "-v" "$(pwd)/packages:/app/packages:rw"
            "-v" "$(pwd)/security-reports:/app/security-reports:rw"
            "-e" "NPM_TOKEN"
            "-e" "NODE_AUTH_TOKEN=${NPM_TOKEN}"
            "-e" "NODE_ENV=production"
            "-e" "NPM_CONFIG_CACHE=/tmp/npm-cache"
            "depup-security-sandbox"
          )

          # Add package processing arguments
          DOCKER_ARGS+=("$PACKAGE_NAME")

          if [ "$BUMP_DEPS" = "true" ]; then
            DOCKER_ARGS+=("--bump-deps")
          fi

          if [ "$DO_TEST" = "true" ]; then
            DOCKER_ARGS+=("--test")
          fi

          if [ "$DO_PUBLISH" = "true" ]; then
            DOCKER_ARGS+=("--publish")
          fi

          if [ "$DO_DEBUG" = "true" ]; then
            DOCKER_ARGS+=("--debug")
          fi

          # Execute in security sandbox
          echo "Running: docker ${DOCKER_ARGS[@]}"
          docker "${DOCKER_ARGS[@]}"

      - name: Validate processing results
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          echo "Validating processing results..."

          # Check if package was processed successfully
          if [ -d "packages/$PACKAGE_NAME" ]; then
            echo "Package directory created"

            # Check for integrity data (generated by depup.mjs)
            if [ -f "packages/$PACKAGE_NAME/integrity.json" ]; then
              echo "Integrity data present"
            else
              echo "Warning: No integrity data found (may be first run)"
            fi

            # Check for security attestation (optional -- not yet generated by depup.mjs)
            if [ -f "packages/$PACKAGE_NAME/security-attestation.json" ]; then
              echo "Security attestation present"
            fi
          else
            echo "Package processing failed - no output directory"
            exit 1
          fi

      - name: Commit processed packages
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local author.name "De Pup"
          git config --local author.email "devdepup@gmail.com"

          git add packages/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "security: process $PACKAGE_NAME with security validation"
            for attempt in 1 2 3; do
              git fetch origin main
              # Clean unstaged changes before rebase (case-different files from packages)
              git checkout -- . 2>/dev/null || true
              if ! git rebase origin/main; then
                echo "Rebase failed on attempt $attempt, aborting..."
                git rebase --abort 2>/dev/null || true
                sleep 2
                if [ "$attempt" -eq 3 ]; then
                  echo "Rebase failed after 3 attempts"
                  exit 1
                fi
              elif git push origin main; then
                echo "Push successful on attempt $attempt"
                break
              else
                if [ "$attempt" -eq 3 ]; then
                  echo "Push failed after 3 attempts"
                  exit 1
                fi
                echo "Push failed on attempt $attempt, retrying..."
                sleep 2
              fi
            done
          fi

      - name: Upload processing reports
        uses: actions/upload-artifact@v4
        with:
          name: processing-reports-${{ needs.security-validation.outputs.package_safe }}
          path: security-reports/
          retention-days: 30

  final-validation:
    name: Final Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [secure-processing, security-validation]
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ needs.security-validation.outputs.package_safe }}"
          path: final-reports/

      - name: Ensure report directory exists
        run: mkdir -p final-reports

      - name: Generate final security report
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          RUN_ID: ${{ github.run_id }}
          PACKAGE_ALLOWED: ${{ needs.security-validation.outputs.package_allowed }}
          SECURITY_STATUS: ${{ needs.security-validation.outputs.security_status }}
          COMPAT_SCORE: ${{ needs.security-validation.outputs.compatibility_score }}
        run: |
          echo "Generating comprehensive security report..."

          # Determine status labels
          if [ "$PACKAGE_ALLOWED" = "true" ]; then
            ALLOWLIST_LABEL="APPROVED"
          else
            ALLOWLIST_LABEL="DENIED"
          fi

          if [ "$COMPAT_SCORE" -ge 80 ] 2>/dev/null; then
            COMPAT_LABEL="EXCELLENT"
          elif [ "$COMPAT_SCORE" -ge 60 ] 2>/dev/null; then
            COMPAT_LABEL="GOOD"
          else
            COMPAT_LABEL="NEEDS ATTENTION"
          fi

          PROCESSING_DATE=$(date -Iseconds)

          # Combine all reports into final assessment
          cat > final-reports/security-assessment.md << REPORT_EOF
          # DepUp Security Assessment Report

          ## Package Information
          - **Package**: $PACKAGE_NAME
          - **Processing Date**: $PROCESSING_DATE
          - **Workflow Run**: $RUN_ID

          ## Security Validation Results

          ### 1. Allowlist Check
          - Status: $ALLOWLIST_LABEL

          ### 2. Security Scanning
          - Status: $SECURITY_STATUS
          - Malware Scan: Completed
          - Vulnerability Scan: Completed

          ### 3. Compatibility Analysis
          - Score: $COMPAT_SCORE/100
          - Status: $COMPAT_LABEL

          ### 4. Secure Processing
          - Container Isolation: Enabled
          - Sandbox Execution: Completed
          - Security Attestation: Generated

          ## Recommendations

          REPORT_EOF

          # Add specific recommendations based on results
          if [ "$PACKAGE_ALLOWED" != "true" ]; then
            echo "- Request security approval for this package" >> final-reports/security-assessment.md
          fi

          if [ "$SECURITY_STATUS" = "failed" ]; then
            echo "- Address security scan failures before publishing" >> final-reports/security-assessment.md
          fi

          if [ "$COMPAT_SCORE" -lt 60 ] 2>/dev/null; then
            echo "- Improve dependency compatibility" >> final-reports/security-assessment.md
          fi

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: final-security-report-${{ needs.security-validation.outputs.package_safe }}
          path: final-reports/
          retention-days: 90

      - name: Final summary
        if: always()
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          VALIDATION_RESULT: ${{ needs.security-validation.result }}
          PROCESSING_RESULT: ${{ needs.secure-processing.result }}
          PACKAGE_ALLOWED: ${{ needs.security-validation.outputs.package_allowed }}
          COMPAT_SCORE: ${{ needs.security-validation.outputs.compatibility_score }}
        run: |
          echo "## Secure DepUp Processing Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package: $PACKAGE_NAME" >> $GITHUB_STEP_SUMMARY
          if [ "$VALIDATION_RESULT" = "success" ]; then
            echo "- **Security Validation**: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Security Validation**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$PROCESSING_RESULT" = "success" ]; then
            echo "- **Secure Processing**: COMPLETED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Secure Processing**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$PACKAGE_ALLOWED" = "true" ]; then
            echo "- **Allowlist Status**: Approved" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Allowlist Status**: Not Approved" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Security Score**: $COMPAT_SCORE/100" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Features Applied:" >> $GITHUB_STEP_SUMMARY
          echo "- Container Sandboxing" >> $GITHUB_STEP_SUMMARY
          echo "- Malware Scanning (ClamAV)" >> $GITHUB_STEP_SUMMARY
          echo "- Vulnerability Assessment" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Compatibility Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Security Attestation" >> $GITHUB_STEP_SUMMARY
          echo "- Allowlist Validation" >> $GITHUB_STEP_SUMMARY
