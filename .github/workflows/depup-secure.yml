name: Secure DepUp Package Processing

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'npm package to process securely (must be in allowlist)'
        required: true
        type: string
      bump_deps:
        description: 'Bump dependencies to latest versions'
        required: false
        type: boolean
        default: true
      test:
        description: 'Run comprehensive security testing'
        required: false
        type: boolean
        default: true
      publish:
        description: 'Publish to npm after security validation'
        required: false
        type: boolean
        default: false
      debug:
        description: 'Enable debug mode'
        required: false
        type: boolean
        default: false
      strict_security:
        description: 'Enforce strict security requirements'
        required: false
        type: boolean
        default: true

# Default read-only; only the secure-processing job (which commits package
# data and pushes to main) is granted contents: write at the job level.
permissions:
  contents: read

concurrency:
  group: depup-secure-${{ inputs.package }}
  cancel-in-progress: false

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  security-validation:
    name: Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      package_allowed: ${{ steps.allowlist-check.outputs.allowed }}
      security_status: ${{ steps.security-scan.outputs.status }}
      compatibility_score: ${{ steps.compatibility-test.outputs.score }}
      package_safe: ${{ steps.sanitize.outputs.safe_name }}

    steps:
      - name: Sanitize package name for artifact paths
        id: sanitize
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          SAFE_NAME=$(echo "$PACKAGE_NAME" | sed 's/[/@]/_/g')
          echo "safe_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job npm-installs the (untrusted) package under analysis --
          # never leave the repo token on disk where install scripts could read it
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install security tools (optional)
        continue-on-error: true
        run: |
          # Try to install ClamAV for enhanced malware scanning
          if command -v apt-get >/dev/null 2>&1; then
            echo "Installing ClamAV..."
            sudo apt-get update && sudo apt-get install -y clamav clamav-daemon
            freshclam --quiet || echo "ClamAV database update failed, continuing..."
          else
            echo "apt-get not available, skipping ClamAV installation"
          fi

      - name: Validate package allowlist
        id: allowlist-check
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          STRICT_SECURITY: ${{ inputs.strict_security }}
        run: |
          echo "Checking if $PACKAGE_NAME is in security allowlist..."
          EXIT_CODE=0
          node scripts/security-approval.mjs status "$PACKAGE_NAME" || EXIT_CODE=$?

          # Check exit code to determine if package is allowed
          if [ $EXIT_CODE -eq 0 ]; then
            echo "allowed=true" >> $GITHUB_OUTPUT
            echo "✅ Package is in security allowlist"
          else
            echo "allowed=false" >> $GITHUB_OUTPUT
            echo "❌ Package not in security allowlist"
            if [ "$STRICT_SECURITY" = "true" ]; then
              echo "Strict security mode: failing workflow"
              exit 1
            fi
          fi

      - name: Download and extract package for scanning
        id: download
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          echo "Downloading package for security analysis..."
          mkdir -p temp-package
          cd temp-package
          npm init -y > /dev/null 2>&1
          # --ignore-scripts: the package is untrusted and is only being fetched
          # for scanning; its install scripts must not run before the scan.
          npm install "$PACKAGE_NAME" --no-save --ignore-scripts

          # Strip version specifier for node_modules path lookup
          # e.g., express@5.0.0 -> express, @angular/core@17.0.0 -> @angular/core
          SCAN_NAME="$PACKAGE_NAME"
          if [[ "$SCAN_NAME" =~ ^(@[^@]+)@.+ ]]; then
            SCAN_NAME="${BASH_REMATCH[1]}"
          elif [[ "$SCAN_NAME" =~ ^([^@]+)@.+ ]]; then
            SCAN_NAME="${BASH_REMATCH[1]}"
          fi
          echo "scan_name=$SCAN_NAME" >> $GITHUB_OUTPUT

      - name: Run security scan
        id: security-scan
        env:
          SCAN_NAME: ${{ steps.download.outputs.scan_name }}
          STRICT_SECURITY: ${{ inputs.strict_security }}
        run: |
          echo "Running comprehensive security scan..."
          mkdir -p security-reports
          node scripts/security-scan.mjs "temp-package/node_modules/$SCAN_NAME" \
            --report security-reports/security-scan.json

          # Check scan results (find the latest report file)
          REPORT_FILE=$(ls -t security-reports/security-scan*.json | head -1)
          if [ -z "$REPORT_FILE" ]; then
            echo "❌ No security report found"
            exit 1
          fi
          SCAN_STATUS=$(jq -r '.overall_status // "unknown"' "$REPORT_FILE")
          echo "status=$SCAN_STATUS" >> $GITHUB_OUTPUT
          echo "Found security report: $REPORT_FILE"

          if [ "$SCAN_STATUS" = "failed" ]; then
            echo "❌ Security scan failed"
            if [ "$STRICT_SECURITY" = "true" ]; then
              exit 1
            fi
          else
            echo "✅ Security scan passed ($SCAN_STATUS)"
          fi

      - name: Run compatibility test
        id: compatibility-test
        env:
          SCAN_NAME: ${{ steps.download.outputs.scan_name }}
          STRICT_SECURITY: ${{ inputs.strict_security }}
        run: |
          echo "Running compatibility analysis..."
          COMPAT_ARGS=("temp-package/node_modules/$SCAN_NAME" "--report" "security-reports/compatibility.json")
          if [ "$STRICT_SECURITY" = "true" ]; then
            COMPAT_ARGS+=("--strict")
          fi
          node scripts/compatibility-test.mjs "${COMPAT_ARGS[@]}"

          # Extract compatibility score (find the latest report file)
          COMPATIBILITY_FILE=$(ls -t security-reports/compatibility*.json 2>/dev/null | head -1 || echo "security-reports/compatibility.json")
          if [ ! -f "$COMPATIBILITY_FILE" ]; then
            echo "Compatibility report not found, assuming score 80"
            COMPATIBILITY_SCORE=80
          else
            COMPATIBILITY_SCORE=$(jq -r '.compatibility.score // 80' "$COMPATIBILITY_FILE" 2>/dev/null || echo "80")
          fi
          echo "score=$COMPATIBILITY_SCORE" >> $GITHUB_OUTPUT

          if [ "$COMPATIBILITY_SCORE" -lt 60 ] && [ "$STRICT_SECURITY" = "true" ]; then
            echo "❌ Compatibility score too low: $COMPATIBILITY_SCORE/100"
            exit 1
          fi

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports-${{ steps.sanitize.outputs.safe_name || needs.security-validation.outputs.package_safe }}
          path: security-reports/
          retention-days: 7

      - name: Security validation summary
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          ALLOWLIST_STATUS: ${{ steps.allowlist-check.outputs.allowed }}
          SCAN_STATUS: ${{ steps.security-scan.outputs.status }}
          COMPAT_SCORE: ${{ steps.compatibility-test.outputs.score }}
          STRICT_SECURITY: ${{ inputs.strict_security }}
        run: |
          echo "## Security Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: $PACKAGE_NAME" >> $GITHUB_STEP_SUMMARY
          if [ "$ALLOWLIST_STATUS" = "true" ]; then
            echo "- **Allowlist Status**: APPROVED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Allowlist Status**: NOT APPROVED" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Security Scan**: $SCAN_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "- **Compatibility Score**: $COMPAT_SCORE/100" >> $GITHUB_STEP_SUMMARY
          if [ "$STRICT_SECURITY" = "true" ]; then
            echo "- **Strict Security**: Enabled" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Strict Security**: Disabled" >> $GITHUB_STEP_SUMMARY
          fi

  container-build:
    name: Build Security Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: security-validation
    if: needs.security-validation.outputs.package_allowed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build security sandbox
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          tags: depup-security-sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/depup-sandbox.tar

      - name: Upload container image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: depup-security-sandbox
          path: /tmp/depup-sandbox.tar
          retention-days: 1

  secure-processing:
    name: Secure Package Processing
    runs-on: ubuntu-latest
    needs: [security-validation, container-build]
    timeout-minutes: 45
    # Runs untrusted package code inside the sandbox container. The job holds no
    # secret and cannot write; with publish=true the container only stages the
    # package (--stage-only) -- it never receives an npm token.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download security container
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: depup-security-sandbox
          path: /tmp/

      - name: Load security container
        run: |
          docker load --input /tmp/depup-sandbox.tar

      - name: Create secure processing environment
        run: |
          # Create temporary directories with proper permissions
          mkdir -p packages security-reports staging temp-processing
          chmod 755 packages security-reports staging temp-processing

      - name: Run secure package processing
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          BUMP_DEPS: ${{ inputs.bump_deps }}
          DO_TEST: ${{ inputs.test }}
          DO_PUBLISH: ${{ inputs.publish }}
          DO_DEBUG: ${{ inputs.debug }}
        run: |
          echo "🚀 Starting secure package processing..."

          # Build docker run arguments
          # Note: network access is required for npm registry (download + dep version checks)
          # Security is enforced via: read-only rootfs, memory/cpu/pid limits, dropped caps,
          # and no credential of any kind in the container environment.
          DOCKER_ARGS=(
            "run" "--rm"
            "--read-only"
            "--tmpfs" "/tmp:rw,exec"
            "--memory" "2g"
            "--cpus" "2"
            "--pids-limit" "100"
            "--cap-drop" "ALL"
            "--security-opt" "no-new-privileges"
            "-v" "$(pwd)/packages:/app/packages:rw"
            "-v" "$(pwd)/security-reports:/app/security-reports:rw"
            "-v" "$(pwd)/staging:/app/staging:rw"
            "-e" "NODE_ENV=production"
            "-e" "DEPUP_GATE_REPORT_DIR=/app/security-reports"
            "-e" "DEPUP_GATE_TIMEOUT_MS=300000"
            "-e" "NPM_CONFIG_CACHE=/tmp/npm-cache"
            "depup-security-sandbox"
          )

          # Add package processing arguments
          DOCKER_ARGS+=("$PACKAGE_NAME")

          if [ "$BUMP_DEPS" = "true" ]; then
            DOCKER_ARGS+=("--bump-deps")
          fi

          if [ "$DO_TEST" = "true" ]; then
            DOCKER_ARGS+=("--test")
          fi

          # A publishing run packs the package into the mounted staging
          # directory for the publish job; nothing is published from here.
          if [ "$DO_PUBLISH" = "true" ]; then
            DOCKER_ARGS+=("--stage-only" "/app/staging")
          fi

          if [ "$DO_DEBUG" = "true" ]; then
            DOCKER_ARGS+=("--debug")
          fi

          # Execute in security sandbox
          echo "Running: docker ${DOCKER_ARGS[*]}"
          docker "${DOCKER_ARGS[@]}"

      - name: Validate processing results
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          DO_PUBLISH: ${{ inputs.publish }}
        run: |
          echo "Validating processing results..."

          # Check if package was processed successfully
          if [ -d "packages/$PACKAGE_NAME" ]; then
            echo "Package directory created"

            # Check for integrity data (generated by depup.mjs)
            if [ -f "packages/$PACKAGE_NAME/integrity.json" ]; then
              echo "Integrity data present"
            else
              echo "Warning: No integrity data found (may be first run)"
            fi

            # The publish gate (scripts/publish-gate.mjs) records its result
            # whenever depup.mjs is about to publish a package.
            if [ -f "security-reports/publish-gate.json" ]; then
              echo "Publish gate result present"
            elif [ "$DO_PUBLISH" = "true" ]; then
              echo "::warning::No publish gate result was recorded for $PACKAGE_NAME"
            fi
          else
            echo "Package processing failed - no output directory"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Last step that touches package data: the files this run changed under
      # packages/, as plain data for the commit job.
      - name: Collect package data
        run: |
          node scripts/staged-publish.mjs collect-data --out "$RUNNER_TEMP/package-data"

      - name: Upload staged package
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staged-package-${{ github.run_id }}
          path: staging
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Upload package data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-data-${{ github.run_id }}
          path: ${{ runner.temp }}/package-data
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Upload processing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: processing-reports-${{ needs.security-validation.outputs.package_safe }}
          path: security-reports/
          retention-days: 7

  secure-publish:
    name: Publish Staged Package
    runs-on: ubuntu-latest
    needs: secure-processing
    # Only a publishing run whose sandboxed processing (including the publish
    # gate) succeeded and staged a package.
    if: ${{ inputs.publish && needs.secure-processing.result == 'success' }}
    timeout-minutes: 15
    # Holds NPM_TOKEN and nothing else; runs no package code.
    permissions:
      contents: read

    steps:
      - name: Checkout publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Download staged package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staged-package-${{ github.run_id }}
          path: ${{ runner.temp }}/stage

      # The only step that sees the token. The requested package is the only one
      # allowed; a version spec (express@5.0.0) is reduced to its name.
      - name: Publish staged package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_SPEC: ${{ inputs.package }}
        run: |
          name="$PACKAGE_SPEC"
          if [[ "$name" == @*/*@* ]]; then
            name="${name%@*}"
          elif [[ "$name" != @* && "$name" == *@* ]]; then
            name="${name%@*}"
          fi
          node scripts/staged-publish.mjs publish-staged "$RUNNER_TEMP/stage" \
            --results "$RUNNER_TEMP/publish-results/results.json" \
            --expect-package "$name" \
            --require-staged

      - name: Upload publish results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-results-${{ github.run_id }}
          path: ${{ runner.temp }}/publish-results
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

  secure-commit:
    name: Commit Processed Package
    runs-on: ubuntu-latest
    needs: [secure-processing, secure-publish]
    # A run without publish skips the publish job and still commits the
    # processed data, as before; a failed processing or publish commits nothing.
    if: ${{ !cancelled() && needs.secure-processing.result == 'success' && (needs.secure-publish.result == 'success' || needs.secure-publish.result == 'skipped') }}
    timeout-minutes: 15
    # No package code runs here: version control, staged-publish.mjs from the
    # trusted checkout, and the signing key.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # staged-publish.mjs uses only Node built-ins: no dependency install here.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Download package data
        id: download-data
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-data-${{ github.run_id }}
          path: ${{ runner.temp }}/package-data

      - name: Download publish results
        if: needs.secure-publish.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-results-${{ github.run_id }}
          path: ${{ runner.temp }}/publish-results

      # The artifact comes from a job that ran untrusted code: only paths of the
      # shapes depup writes, regular files only, JSON that parses; anything else
      # is dropped with a warning. Nothing in it is ever executed.
      - name: Apply package data
        if: steps.download-data.outcome == 'success'
        run: |
          node scripts/staged-publish.mjs import-data "$RUNNER_TEMP/package-data" --packages-root packages

      # The sandbox recorded a staged revision as `failed` (not confirmed
      # published); only the publish job's results flip it to `published`.
      - name: Record publish results
        if: steps.download-data.outcome == 'success' && needs.secure-publish.result == 'success'
        run: |
          node scripts/staged-publish.mjs finalize-integrity \
            --results "$RUNNER_TEMP/publish-results/results.json" \
            --packages-root packages \
            --require-results

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Commit processed packages
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          git config --local user.name "De Pup"
          git config --local user.email "devdepup@gmail.com"
          git config --local commit.gpgsign true
          git config --local gpg.program gpg
          git config --local user.signingkey 5A5141965C39129D

          git add packages/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "security: process $PACKAGE_NAME with security validation"
            for attempt in 1 2 3; do
              git fetch origin main
              # Clean unstaged changes before rebase (case-different files from packages)
              git checkout -- . 2>/dev/null || true
              if ! git rebase origin/main; then
                echo "Rebase failed on attempt $attempt, aborting..."
                git rebase --abort 2>/dev/null || true
                sleep 2
                if [ "$attempt" -eq 3 ]; then
                  echo "Rebase failed after 3 attempts"
                  exit 1
                fi
              elif git push origin main; then
                echo "Push successful on attempt $attempt"
                break
              else
                if [ "$attempt" -eq 3 ]; then
                  echo "Push failed after 3 attempts"
                  exit 1
                fi
                echo "Push failed on attempt $attempt, retrying..."
                sleep 2
              fi
            done
          fi

  final-validation:
    name: Final Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [security-validation, secure-processing, secure-publish, secure-commit]
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-${{ needs.security-validation.outputs.package_safe }}"
          path: final-reports/

      - name: Ensure report directory exists
        run: mkdir -p final-reports

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # The assessment and summary below are rendered from recorded results
      # only: the pre-processing scan report and the publish gate result.
      # A scan with no result is reported as not run, never as completed.
      - name: Locate recorded scan results
        id: locate
        run: |
          echo "gate_report=$(find final-reports -name publish-gate.json -print -quit)" >> "$GITHUB_OUTPUT"
          echo "scan_report=$(find final-reports -name 'security-scan-*.json' -print -quit)" >> "$GITHUB_OUTPUT"

      - name: Generate final security report
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          RUN_ID: ${{ github.run_id }}
          PACKAGE_ALLOWED: ${{ needs.security-validation.outputs.package_allowed }}
          SECURITY_STATUS: ${{ needs.security-validation.outputs.security_status }}
          COMPAT_SCORE: ${{ needs.security-validation.outputs.compatibility_score }}
          VALIDATION_RESULT: ${{ needs.security-validation.result }}
          PROCESSING_RESULT: ${{ needs.secure-processing.result == 'success' && (needs.secure-publish.result == 'success' || needs.secure-publish.result == 'skipped') && needs.secure-commit.result == 'success' && 'success' || needs.secure-processing.result == 'success' && 'failure' || needs.secure-processing.result }}
          GATE_REPORT: ${{ steps.locate.outputs.gate_report }}
          SCAN_REPORT: ${{ steps.locate.outputs.scan_report }}
        run: |
          echo "Generating security report from recorded results..."
          node scripts/render-security-report.mjs assessment \
            --package "$PACKAGE_NAME" \
            --run-id "$RUN_ID" \
            --allowed "$PACKAGE_ALLOWED" \
            --security-status "$SECURITY_STATUS" \
            --compat-score "$COMPAT_SCORE" \
            --validation-result "$VALIDATION_RESULT" \
            --processing-result "$PROCESSING_RESULT" \
            --gate-report "$GATE_REPORT" \
            --scan-report "$SCAN_REPORT" \
            > final-reports/security-assessment.md

      - name: Upload final report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final-security-report-${{ needs.security-validation.outputs.package_safe }}
          path: final-reports/
          retention-days: 7

      - name: Final summary
        if: always()
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          RUN_ID: ${{ github.run_id }}
          VALIDATION_RESULT: ${{ needs.security-validation.result }}
          PROCESSING_RESULT: ${{ needs.secure-processing.result == 'success' && (needs.secure-publish.result == 'success' || needs.secure-publish.result == 'skipped') && needs.secure-commit.result == 'success' && 'success' || needs.secure-processing.result == 'success' && 'failure' || needs.secure-processing.result }}
          PACKAGE_ALLOWED: ${{ needs.security-validation.outputs.package_allowed }}
          SECURITY_STATUS: ${{ needs.security-validation.outputs.security_status }}
          COMPAT_SCORE: ${{ needs.security-validation.outputs.compatibility_score }}
          GATE_REPORT: ${{ steps.locate.outputs.gate_report }}
          SCAN_REPORT: ${{ steps.locate.outputs.scan_report }}
        run: |
          node scripts/render-security-report.mjs summary \
            --package "$PACKAGE_NAME" \
            --run-id "$RUN_ID" \
            --allowed "$PACKAGE_ALLOWED" \
            --security-status "$SECURITY_STATUS" \
            --compat-score "$COMPAT_SCORE" \
            --validation-result "$VALIDATION_RESULT" \
            --processing-result "$PROCESSING_RESULT" \
            --gate-report "$GATE_REPORT" \
            --scan-report "$SCAN_REPORT" \
            >> "$GITHUB_STEP_SUMMARY"
