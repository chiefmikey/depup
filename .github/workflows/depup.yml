name: DepUp Package Processing

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'npm package to process (e.g., lodash, express@5.0.0)'
        required: true
        type: string
      bump_deps:
        description: 'Bump dependencies to latest versions'
        required: false
        type: boolean
        default: true
      test:
        description: 'Test package functionality'
        required: false
        type: boolean
        default: true
      publish:
        description: 'Publish to npm (requires NPM_TOKEN)'
        required: false
        type: boolean
        default: false
      debug:
        description: 'Enable debug mode'
        required: false
        type: boolean
        default: false

concurrency:
  group: depup-${{ github.workflow }}-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  process-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.package }}" ]; then
            echo "Error: Package name is required"
            exit 1
          fi
          echo "Processing package: ${{ inputs.package }}"

      - name: Process package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ inputs.package }}
          BUMP_DEPS: ${{ inputs.bump_deps }}
          DO_TEST: ${{ inputs.test }}
          DO_PUBLISH: ${{ inputs.publish }}
          DO_DEBUG: ${{ inputs.debug }}
        run: |
          ARGS=("$PACKAGE_NAME")

          if [ "$BUMP_DEPS" = "true" ]; then
            ARGS+=("--bump-deps")
          fi

          if [ "$DO_TEST" = "true" ]; then
            ARGS+=("--test")
          fi

          if [ "$DO_PUBLISH" = "true" ]; then
            ARGS+=("--publish")
          fi

          if [ "$DO_DEBUG" = "true" ]; then
            ARGS+=("--debug")
          fi

          echo "Running: npm run depup -- ${ARGS[*]}"
          npm run depup -- "${ARGS[@]}"

      - name: Commit changes
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          git config --local user.name "DepUp Bot"
          git config --local user.email "bot@depup.dev"

          git add packages/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: process ${PACKAGE_NAME} with DepUp"
            git push origin main
          fi

      - name: Create summary
        if: always()
        run: |
          echo "## DepUp Processing Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: ${{ inputs.package }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump Dependencies**: ${{ inputs.bump_deps }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Package**: ${{ inputs.test }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Publish Package**: ${{ inputs.publish }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug Mode**: ${{ inputs.debug }}" >> $GITHUB_STEP_SUMMARY

