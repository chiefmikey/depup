name: DepUp Package Processing

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'npm package to process (e.g., lodash, express@5.0.0)'
        required: true
        type: string
      bump_deps:
        description: 'Bump dependencies to latest versions'
        required: false
        type: boolean
        default: true
      test:
        description: 'Test package functionality'
        required: false
        type: boolean
        default: true
      publish:
        description: 'Publish to npm (requires NPM_TOKEN)'
        required: false
        type: boolean
        default: false
      debug:
        description: 'Enable debug mode'
        required: false
        type: boolean
        default: false

concurrency:
  group: depup-${{ github.workflow }}-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  process-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Validate inputs
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          if [ -z "$PACKAGE_NAME" ]; then
            echo "Error: Package name is required"
            exit 1
          fi
          echo "Processing package: $PACKAGE_NAME"

      - name: Process package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ inputs.package }}
          BUMP_DEPS: ${{ inputs.bump_deps }}
          DO_TEST: ${{ inputs.test }}
          DO_PUBLISH: ${{ inputs.publish }}
          DO_DEBUG: ${{ inputs.debug }}
        run: |
          ARGS=("$PACKAGE_NAME")

          if [ "$BUMP_DEPS" = "true" ]; then
            ARGS+=("--bump-deps")
          fi

          if [ "$DO_TEST" = "true" ]; then
            ARGS+=("--test")
          fi

          if [ "$DO_PUBLISH" = "true" ]; then
            ARGS+=("--publish")
          fi

          if [ "$DO_DEBUG" = "true" ]; then
            ARGS+=("--debug")
          fi

          echo "Running: npm run depup -- ${ARGS[*]}"
          npm run depup -- "${ARGS[@]}"

      - name: Import GPG Key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Commit changes
        env:
          PACKAGE_NAME: ${{ inputs.package }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local author.name "De Pup"
          git config --local author.email "devdepup@gmail.com"
          git config --local commit.gpgsign true
          git config --local gpg.program gpg
          git config --local user.signingkey 5A5141965C39129D

          git add packages/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: process $PACKAGE_NAME with DepUp"
            for attempt in 1 2 3; do
              git fetch origin main
              # Clean unstaged changes before rebase (case-different files from packages)
              git checkout -- . 2>/dev/null || true
              if ! git rebase origin/main; then
                echo "Rebase failed on attempt $attempt, aborting..."
                git rebase --abort 2>/dev/null || true
                sleep 2
                if [ "$attempt" -eq 3 ]; then
                  echo "Rebase failed after 3 attempts"
                  exit 1
                fi
              elif git push origin main; then
                echo "Push successful on attempt $attempt"
                break
              else
                if [ "$attempt" -eq 3 ]; then
                  echo "Push failed after 3 attempts"
                  exit 1
                fi
                echo "Push failed on attempt $attempt, retrying..."
                sleep 2
              fi
            done
          fi

      - name: Create summary
        if: always()
        env:
          PACKAGE_NAME: ${{ inputs.package }}
          BUMP_DEPS: ${{ inputs.bump_deps }}
          DO_TEST: ${{ inputs.test }}
          DO_PUBLISH: ${{ inputs.publish }}
          DO_DEBUG: ${{ inputs.debug }}
        run: |
          echo "## DepUp Processing Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Package**: $PACKAGE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Bump Dependencies**: $BUMP_DEPS" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Package**: $DO_TEST" >> $GITHUB_STEP_SUMMARY
          echo "- **Publish Package**: $DO_PUBLISH" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug Mode**: $DO_DEBUG" >> $GITHUB_STEP_SUMMARY

