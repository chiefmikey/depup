name: "Unit Tests"

# Runs the unit suite (no integration tests — those hit the live npm registry).
# Scoped to source paths so the every-8h De Pup package-data commits do not
# trigger redundant test runs.
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.cjs'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.cjs'
      - '.github/workflows/test.yml'

# Read-only: runs tests, never pushes
permissions:
  contents: read

concurrency:
  group: depup-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit
