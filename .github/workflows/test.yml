name: "Unit Tests"

# Runs the unit suite (no integration tests — those hit the live npm registry).
# Scoped to source paths so the every-8h De Pup package-data commits do not
# trigger redundant test runs.
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.cjs'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.cjs'
      - '.github/workflows/test.yml'

# Read-only: runs tests, never pushes
permissions:
  contents: read

concurrency:
  group: depup-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '26']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit
