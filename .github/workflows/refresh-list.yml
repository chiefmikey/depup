name: Refresh Curated Package List

on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch: {}

# Least privilege: no workflow-wide token scopes. Each job declares exactly
# what it needs (contents: write only on jobs that push package data to main).
permissions: {}

concurrency:
  cancel-in-progress: false
  group: depup-refresh-list

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Configure Git
        run: |
          git config --global user.name "De Pup"
          git config --global user.email "devdepup@gmail.com"
          git config --global commit.gpgsign true
          git config --global gpg.program gpg
          git config --global user.signingkey 5A5141965C39129D

      - name: Refresh Curated Package List
        run: node scripts/refresh-curated-list.mjs

      - name: Commit and Push
        run: |
          git add config/curated-packages.json
          if git diff --cached --quiet; then
            echo "No changes to package list"
            exit 0
          fi
          git commit -m "chore: refresh curated package list from npm popularity data"
          for attempt in 1 2 3; do
            git fetch origin main
            # Clean any unstaged changes before rebase (case-different files from packages)
            git checkout -- . 2>/dev/null || true
            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true
              sleep 2
              if [ "$attempt" -eq 3 ]; then
                echo "Rebase failed after 3 attempts"
                exit 1
              fi
            elif git push origin main; then
              echo "Push successful on attempt $attempt"
              break
            else
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts"
                exit 1
              fi
              sleep 2
            fi
          done
