name: Refresh Curated Package List

on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch: {}

concurrency:
  cancel-in-progress: false
  group: depup-refresh-list

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Import GPG Key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Configure Git
        run: |
          git config --global user.name "De Pup"
          git config --global user.email "devdepup@gmail.com"
          git config --global commit.gpgsign true
          git config --global gpg.program gpg
          git config --global user.signingkey 5A5141965C39129D

      - name: Refresh Curated Package List
        run: node scripts/refresh-curated-list.mjs

      - name: Commit and Push
        run: |
          git add config/curated-packages.json
          if git diff --cached --quiet; then
            echo "No changes to package list"
            exit 0
          fi
          git commit -m "chore: refresh curated package list from npm popularity data"
          for attempt in 1 2 3; do
            git fetch origin main
            # Clean any unstaged changes before rebase (case-different files from packages)
            git checkout -- . 2>/dev/null || true
            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true
              sleep 2
              if [ "$attempt" -eq 3 ]; then
                echo "Rebase failed after 3 attempts"
                exit 1
              fi
            elif git push origin main; then
              echo "Push successful on attempt $attempt"
              break
            else
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts"
                exit 1
              fi
              sleep 2
            fi
          done
